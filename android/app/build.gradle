plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def credentialsFile = rootProject.file("../credentials.json")
def releaseKeystore = credentialsFile.exists()
    ? new groovy.json.JsonSlurper().parseText(credentialsFile.text).android.keystore
    : null

def propertyOrEnvironment = { String propertyName, String environmentName, String fallback ->
    providers.gradleProperty(propertyName)
        .orElse(providers.environmentVariable(environmentName))
        .getOrElse(fallback)
}

def testAdMobAppId = "ca-app-pub-3940256099942544~3347511713"
def testBannerAdUnitId = "ca-app-pub-3940256099942544/9214589741"
def testInterstitialAdUnitId = "ca-app-pub-3940256099942544/1033173712"
def productionAdMobAppId = propertyOrEnvironment("ADMOB_APP_ID", "ADMOB_APP_ID", "")
def productionBannerAdUnitId = propertyOrEnvironment("ADMOB_BANNER_AD_UNIT_ID", "ADMOB_BANNER_AD_UNIT_ID", "")
def productionInterstitialAdUnitId = propertyOrEnvironment("ADMOB_INTERSTITIAL_AD_UNIT_ID", "ADMOB_INTERSTITIAL_AD_UNIT_ID", "")

android {
    namespace = "com.aaronsedna.hopecards"
    compileSdk 36

    defaultConfig {
        applicationId "com.aaronsedna.hopecards"
        minSdk 23
        targetSdk 36
        versionCode 25
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        manifestPlaceholders = [admobAppId: testAdMobAppId]
        buildConfigField "String", "REMOVE_ADS_PRODUCT_ID", '"remove_ads_lifetime"'
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if (releaseKeystore != null) {
            release {
                storeFile rootProject.file("../${releaseKeystore.keystorePath}")
                storePassword releaseKeystore.keystorePassword
                keyAlias releaseKeystore.keyAlias
                keyPassword releaseKeystore.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            signingConfig = signingConfigs.debug
            buildConfigField "String", "BANNER_AD_UNIT_ID", '"' + testBannerAdUnitId + '"'
            buildConfigField "String", "INTERSTITIAL_AD_UNIT_ID", '"' + testInterstitialAdUnitId + '"'
        }
        release {
            if (releaseKeystore == null) {
                throw new GradleException("Missing credentials.json. Production release signing is required.")
            }
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources = true
            manifestPlaceholders = [admobAppId: productionAdMobAppId]
            buildConfigField "String", "BANNER_AD_UNIT_ID", '"' + productionBannerAdUnitId + '"'
            buildConfigField "String", "INTERSTITIAL_AD_UNIT_ID", '"' + productionInterstitialAdUnitId + '"'
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        resources.excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2026.06.01")

    implementation composeBom
    androidTestImplementation composeBom

    implementation "androidx.activity:activity-compose:1.12.1"
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.4"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4"
    implementation "androidx.datastore:datastore-preferences:1.2.1"

    implementation "com.android.billingclient:billing-ktx:9.1.0"
    implementation "com.google.android.gms:play-services-ads:25.4.0"
    implementation "com.google.android.ump:user-messaging-platform:4.0.0"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"

    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
}

def validateReleaseMonetization = tasks.register("validateReleaseMonetization") {
    doLast {
        def missing = []
        if (!productionAdMobAppId?.trim() || productionAdMobAppId == testAdMobAppId) missing += "ADMOB_APP_ID"
        if (!productionBannerAdUnitId?.trim() || productionBannerAdUnitId == testBannerAdUnitId) missing += "ADMOB_BANNER_AD_UNIT_ID"
        if (!productionInterstitialAdUnitId?.trim() || productionInterstitialAdUnitId == testInterstitialAdUnitId) missing += "ADMOB_INTERSTITIAL_AD_UNIT_ID"
        if (!missing.isEmpty()) {
            throw new GradleException("Production AdMob configuration is required: ${missing.join(', ')}")
        }
    }
}

tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    dependsOn(validateReleaseMonetization)
}
